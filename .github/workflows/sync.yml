name: Auto M3U Sync

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download M3U
        run: |
          curl -fL \
          "https://raw.githubusercontent.com/rohmanabdu/lian/refs/heads/main/hasill" \
          -o playlist.m3u

      - name: Check Playlist
        run: |
          grep -q "#EXTM3U" playlist.m3u

      - name: Update Repository
        run: |
          git config user.name "M3U Auto Sync"
          git config user.email "actions@github.com"
          git add playlist.m3u
          git diff --cached --quiet || (
            git commit -m "Automatic M3U update"
            git push
          )
